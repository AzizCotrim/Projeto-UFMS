<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Style/style.css">
    <title>Projeto UFMS</title>
</head>
<body>
    <section class="barra-lateral">
        <div class="container" id="cont1">
            <div class="foto">
                <!--<img src="" alt="">-->
            </div><!--foto-->
            <div class="nome">
                <p>Aziz Cotrim</p>
            </div>
            <div class="lista">
                <div class="opcao" id="agenda"><p>Agenda</p></div>
                <div class="opcao" id="trabalhos"><p>Trabalhos</p></div>
                <div class="opcao selected" id="notas"><p>Notas</p></div>
                <div class="opcao" id="avisos"><p>Avisos</p></div>
                <div class="opcao" id="relatorios"><p>Relatórios</p></div>
                <div class="opcao" id="enviar"><p>Enviar</p></div>
            </div><!--lista-->
        </div><!--container-->
    </section><!--barra-lateral-->

    <section class="conteudo">
        <div class="container" id="cont2">
            <header>
                <h2 class="titulo">Trabalhos</h2>
                <div class="line"></div>
            </header>

            
        </div><!--container-->
    </section><!--Conteudo-->

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/gerarCalendario.js"></script>
    <script>
        $(document).ready(function() {
            $('#agenda').click(function() {
                $('.selected').removeClass('selected');
                $(this).addClass('selected');
                $('.conteudo').html(`
                    <div class="container" id="cont2">
                        <header>
                            <h2 class="titulo">Calendario</h2>
                            <div class="line"></div>
                        </header>

                        <div class="calendar">
                            <div class="header">
                                <h2 id="monthYear"></h2>
                            </div><!--header-->
                            <div class="weekdays">
                            <div>Dom</div>
                            <div>Seg</div>
                            <div>Ter</div>
                            <div>Qua</div>
                            <div>Qui</div>
                            <div>Sex</div>
                            <div>Sáb</div>
                            </div><!--weekdays-->
                            <div class="days" id="calendarDays"></div>
                        </div><!--calendar-->
                    </div><!--container-->
                `);
                gerarCalendario();
            });

            $('#trabalhos').click(function() {
                $('.selected').removeClass('selected');
                $(this).addClass('selected');
                $('.conteudo').html(`
                    <div class="container" id="cont2">
                        <header>
                            <h2 class="titulo">Trabalhos</h2>
                            <div class="line"></div>
                        </header>

                        <div class="trabalhos-board">
                            <div class="trabalho-card">
                                <p class="materia">História</p>
                                <h3 class="titulo">Revolução Francesa</h3>
                                <p class="descricao">Escreva um resumo de 15 linhas sobre a Revolução Francesa.</p>
                                <p class="data-entrega">Entrega: 10/04/2025</p>
                                <span class="status pendente">Pendente</span>
                            </div><!--trabalho-card-->
                            <div class="trabalho-card">
                                <p class="materia">Ciências</p>
                                <h3 class="titulo">Ciclo da Água</h3>
                                <p class="descricao">Fazer uma maquete representando o ciclo da água.</p>
                                <p class="data-entrega">Entrega: 15/04/2025</p>
                                <span class="status entregue">Entregue</span>
                            </div><!--trabalho-card-->
                        </div><!--trabalhos-board-->
                    </div><!--container-->
                `);
            });

            $('#notas').click(function() {
                $('.selected').removeClass('selected');
                $(this).addClass('selected');
                $('.conteudo').html(`
                    <div class="container" id="cont2">
                        <header>
                            <h2 class="titulo">Notas</h2>
                            <div class="line"></div>
                        </header>
                        
                        <div class="Notas">
                            <div class="materias">
                                <p class="nome-materia">Biologia</p><p class="nota-materia">7,5</p>
                            </div><!--Materias-->
                            <div class="materias">
                                <p class="nome-materia">Fisica</p><p class="nota-materia">9,75</p>
                            </div><!--Materias-->
                            <div class="materias">
                                <p class="nome-materia">História</p><p class="nota-materia">8,25</p>
                            </div><!--Materias-->
                            <div class="materias">
                                <p class="nome-materia">Matemática</p><p class="nota-materia">10,0</p>
                            </div><!--Materias-->
                            <div class="materias">
                                <p class="nome-materia">Portugues</p><p class="nota-materia">5,0</p>
                            </div><!--Materias-->
                            <div class="materias">
                                <p class="nome-materia">Química</p><p class="nota-materia">8,0</p>
                            </div><!--Materias-->
                        </div><!--Notas-->

                    </div><!--container-->
                `);
            });

            $('#avisos').click(function() {
                $('.selected').removeClass('selected');
                $(this).addClass('selected');
                $('.conteudo').html(`
                     <div class="container" id="cont2">
                        <header>
                            <h2 class="titulo">Avisos</h2>
                            <div class="line"></div>
                        </header>
                        <div class="avisos-board">
                            <div class="postit">
                                <div class="postit-header">Aviso Importante</div>
                                <div class="postit-body">Lembre-se de entregar o relatório da disciplina na próxima semana.</div>
                            </div>
                            <div class="postit">
                                <div class="postit-header">Reunião</div>
                                <div class="postit-body">Reunião marcada para as 14h00 na sala 203.</div>
                            </div>
                            <div class="postit">
                                <div class="postit-header">Palestra</div>
                                <div class="postit-body">A palestra acontecerá na sexta-feira.</div>
                            </div>
                            <div class="postit">
                                <div class="postit-header">Aviso Importante</div>
                                <div class="postit-body">Lembre-se de entregar o relatório da disciplina na próxima semana.</div>
                            </div>
                            <div class="postit">
                                <div class="postit-header">Reunião</div>
                                <div class="postit-body">Reunião marcada para as 14h00 na sala 203.</div>
                            </div>
                            <div class="postit">
                                <div class="postit-header">Palestra</div>
                                <div class="postit-body">A palestra acontecerá na sexta-feira.</div>
                            </div>
                        </div><!--avisos-board-->
                    </div><!--container-->
                `);
            });
            
            $('#relatorios').click(function() {
                $('.selected').removeClass('selected');
                $(this).addClass('selected');
                $('.conteudo').html(`
                    <div class="container" id="cont2">
                        <header>
                            <h2 class="titulo">Relatórios</h2>
                            <div class="line"></div>
                        </header>

                        <div class="quadro">
                            <div class="note">
                                <p class="data">03/04/2025</p>
                                <p class="materia">Matéria: Biologia</p>
                                <p class="assunto">Assunto: Evolução</p>
                                <textarea>Resumo da aula</textarea>
                            </div>

                            <div class="note">
                                <p class="data">03/04/2025</p>
                                <p class="materia">Matéria: Biologia</p>
                                <p class="assunto">Assunto: Evolução</p>
                                <textarea>Resumo da aula</textarea>
                            </div>

                        </div>

                    </div><!--container-->
                `);
            });

            $('#enviar').click(function() {
                $('.conteudo').html(`
                    <div class="container" id="cont2">
                        <header>
                            <h2 class="titulo">Enviar</h2>
                            <div class="line"></div>
                        </header>
                        
                        <div class="formulario">
                            <div class="box">
                                <label>Para onde:<select name="" id="">
                                    <option value="">Agenda</option>
                                    <option value="">Trabalhos</option>
                                    <option value="">Notas</option>
                                    <option value="">Avisos</option>
                                    <option value="">Relatórios</option>
                                </select></label>

                                <label>Turma:<select name="turma" id="" >
                                    <option value="">6 Ano</option>
                                    <option value="">7 Ano</option>
                                    <option value="">8 Ano</option>
                                    <option value="">9 Ano</option>
                                    <option value="">1 EM</option>
                                    <option value="">2 EM</option>
                                    <option value="">3 EM</option>
                                </select></label>

                                <label>Para quem:<select name="to" id="">
                                    <option value="">Pais e responsáveis</option>
                                    <option value="">Professores</option>
                                </select></label>

                                <label>Tipo:<select name="tipo" id="">
                                    <option value="">Trabalho</option>
                                    <option value="">Avisos</option>
                                    <option value="">Nota</option>
                                </select></label>

                                <label>Data:
                                    <input type="date" name="" id="">
                                </label>

                                <label>Materia: <select name="materia" id="">
                                    <option value="">Biologia</option>
                                    <option value="">Fisica</option>
                                    <option value="">Historia</option>
                                    <option value="">Matemática</option>
                                    <option value="">Portugues</option>
                                    <option value="">Química</option>
                                </select></label>

                                <label>Conteudo:<textarea name="" id=""></textarea></label>

                            </div><!--box-->
                            <button>ENVIAR</button>
                        </div><!--formulario-->

                    </div><!--container-->
                `);
            });
        });
    </script>

</body>
</html>
